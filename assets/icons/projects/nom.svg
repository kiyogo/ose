<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nomBg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nomEmerald" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="nomTeal" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="nomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas with subtle stroke -->
  <rect width="56" height="56" rx="12" fill="url(#nomBg)"/>
  <rect x="0.5" y="0.5" width="55" height="55" rx="11.5" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1"/>

  <!-- Native Document & Grid Productivity Emblem -->
  <g transform="translate(13, 11)" filter="url(#nomGlow)">
    <!-- Back Sheet (Spreadsheet / Matrix Grid) -->
    <rect x="7" y="2" width="22" height="28" rx="3.5" fill="url(#nomTeal)" opacity="0.4"/>
    <line x1="12" y1="9" x2="24" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="12" y1="14" x2="24" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="12" y1="19" x2="21" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Front Sheet (Clean Document with folded corner) -->
    <path d="M 1,4 C 1,2.5 2.2,1.3 3.7,1.3 L 15,1.3 L 23,9.3 L 23,28.7 C 23,30.2 21.8,31.4 20.3,31.4 L 3.7,31.4 C 2.2,31.4 1,30.2 1,28.7 Z"
          fill="url(#nomEmerald)"/>
    <!-- Folded corner tab -->
    <path d="M 15,1.3 L 15,7.3 C 15,8.4 15.9,9.3 17,9.3 L 23,9.3 Z" fill="#a7f3d0"/>

    <!-- Document Content Lines / Stylized 'N' Monogram -->
    <path d="M 6,14 L 6,24 M 6,14 L 14,24 M 14,14 L 14,24"
          stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
