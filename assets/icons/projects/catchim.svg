<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Upper Blade Gradient: Cyber Cyan to Deep Indigo -->
    <linearGradient id="top-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Lower Blade Gradient: Electric Indigo to Radiant Pink -->
    <linearGradient id="bot-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <!-- Precision 45-degree Razor Cut Plane (Gap = 16px) -->
    <clipPath id="clip-top">
      <polygon points="0,0 512,0 512,504 0,-8"/>
    </clipPath>

    <clipPath id="clip-bot">
      <polygon points="0,8 512,520 512,512 0,512"/>
    </clipPath>
  </defs>

  <!-- Main C Mark - Direct pure emblem with NO background box -->
  <g transform="translate(4, 0)">
    <!-- Upper Cut Blade (Shifted -5px, -5px) -->
    <g transform="translate(-5, -5)" clip-path="url(#clip-top)">
      <path d="M 365 147
               A 155 155 0 1 0 365 365
               L 312 312
               A 80 80 0 1 1 312 200
               Z"
            fill="url(#top-gradient)"/>
    </g>

    <!-- Lower Cut Blade (Shifted +5px, +5px) -->
    <g transform="translate(5, 5)" clip-path="url(#clip-bot)">
      <path d="M 365 147
               A 155 155 0 1 0 365 365
               L 312 312
               A 80 80 0 1 1 312 200
               Z"
            fill="url(#bot-gradient)"/>
    </g>
  </g>
</svg>
