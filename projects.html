<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự án — KIYO Open Source</title>
  <meta name="description" content="Khám phá các dự án mã nguồn mở của KIYO trong các lĩnh vực hệ điều hành, AI, công cụ phát triển và hạ tầng mạng.">
  <meta property="og:title" content="Dự án — KIYO Open Source">
  <meta property="og:description" content="Khám phá các dự án mã nguồn mở của KIYO.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="skip_content">Chuyển đến nội dung chính</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="KIYO Open Source Home">
        <img src="assets/icons/kiyo.svg" alt="KIYO Open Source" class="brand__logo">
      </a>

      <nav class="site-nav" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Trang chủ</a>
        <a href="projects.html" class="nav-link is-active" aria-current="page" data-i18n="nav_projects">Dự án</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme" aria-pressed="false">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <button type="button" id="mobile-menu-btn" class="icon-btn mobile-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobile-nav-drawer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="mobile-nav-drawer" class="mobile-nav-drawer" role="region" aria-label="Mobile Navigation">
      <nav class="mobile-nav-list">
        <a href="index.html" class="mobile-nav-link" data-i18n="nav_home">Trang chủ</a>
        <a href="projects.html" class="mobile-nav-link is-active" data-i18n="nav_projects">Dự án</a>
      </nav>
    </div>
  </header>

  <main id="main-content">

    <section class="section section--no-border">
      <div class="container">
        <div class="filter-toolbar" role="search" aria-label="Filter projects">
          <div class="search-field">
            <svg class="search-field__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              type="text"
              id="project-search"
              class="search-input"
              placeholder="Tìm kiếm dự án..."
              data-i18n-placeholder="search_placeholder"
              aria-label="Search projects"
              autocomplete="off"
            >
          </div>

          <div class="filter-controls">
            <select id="language-filter" class="filter-select" aria-label="Language">
              <option value="all" data-i18n="filter_lang_all">Tất cả ngôn ngữ</option>
            </select>

            <select id="category-filter" class="filter-select" aria-label="Category">
              <option value="all" data-i18n="filter_cat_all">Tất cả danh mục</option>
            </select>

            <select id="status-filter" class="filter-select" aria-label="Status">
              <option value="all" data-i18n="filter_status_all">Tất cả trạng thái</option>
              <option value="Coming soon" data-i18n="filter_status_soon">Sắp ra mắt</option>
              <option value="Sample" data-i18n="filter_status_sample">Bản mẫu</option>
              <option value="verified" data-i18n="filter_status_verified">Đã xác thực</option>
            </select>
          </div>
        </div>


        <div id="projects-catalog-grid" class="projects-grid"></div>

        <div id="load-more-wrap" class="load-more-wrap" hidden>
          <button type="button" id="load-more-btn" class="btn btn--secondary" data-i18n="projects_load_more">
            Xem thêm
          </button>
        </div>

        <div id="projects-empty-state" class="empty-state" hidden>
          <div class="empty-state__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
          <h3 data-i18n="projects_empty_title">Không tìm thấy dự án phù hợp</h3>
          <button type="button" id="reset-filters-btn" class="btn btn--primary" style="margin-top: 12px;" data-i18n="projects_reset_btn">
            Đặt lại bộ lọc
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="index.html" class="brand">
            <img src="assets/icons/kiyo.svg" alt="KIYO Open Source" class="brand__logo brand__logo--footer">
          </a>
          <p data-i18n="footer_tagline">"Cùng nhau phát triển."</p>
        </div>

        <div class="footer-col">
          <h4 data-i18n="footer_explore_title">Khám phá</h4>
          <ul class="footer-links">
            <li><a href="projects.html" data-i18n="footer_projects">Dự án</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4 data-i18n="footer_resources_title">Tài nguyên</h4>
          <ul class="footer-links">
            <li><a href="https://github.com/kiyogo" target="_blank" rel="noopener noreferrer" data-i18n="footer_github">GitHub</a></li>
            <li><a href="https://github.com/kiyogo" target="_blank" rel="noopener noreferrer" data-i18n="footer_documentation">Tài liệu</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4 data-i18n="footer_org_title">Tổ chức</h4>
          <ul class="footer-links">
            <li><a href="https://kiyovn.com" target="_blank" rel="noopener noreferrer">KIYO</a></li>
            <li><a href="https://kiyovn.com/contact" target="_blank" rel="noopener noreferrer" data-i18n="footer_contact">Liên hệ</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <span data-i18n="footer_copyright">© 2026 KIYO. Mã nguồn mở, tương lai rộng mở.</span>
        
        <div class="footer-bottom-actions">
          <div class="footer-lang-wrap">
            <svg class="footer-lang-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <select id="footer-lang-select" class="footer-lang-select" aria-label="Chọn ngôn ngữ / Select language">
              <option value="vi">Tiếng Việt</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/projects.js"></script>
</body>
</html>
